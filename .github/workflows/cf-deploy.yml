name: cf-deploy

# Deploys the Cloudflare runtime (docs/cloudflare.md): a Worker in front of one live
# instance of the repo Dockerfile image. `wrangler deploy` builds that image with
# Docker, which this laptop does not have and ubuntu-latest does, so the deploy lives
# here. The deploy itself stops nothing: the Worker brings a new instance up beside the
# live one and hands over to it (cloudflare/worker.js). Rollback = re-run this workflow on
# the previous commit (Actions > cf-deploy > Run workflow > pick the older commit's
# branch/tag, or push a revert).
#
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (repo secrets, already set).
# The APP's secrets are Worker secrets uploaded once with scripts/cf/secrets-upload.mjs;
# nothing from the app's environment passes through this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The job only reads the repo; Cloudflare is reached with the API token below.
permissions:
  contents: read

# Queue, never cancel: a deploy cut off halfway through an image push is worse than a
# short wait.
concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The same gate as every push. A red verify never reaches Cloudflare.
      - name: Verify
        run: npm run verify

      # How /health learns its commit. wrangler's `image_vars` can pass a Docker build arg,
      # but wrangler.jsonc is static and the SHA changes every run, so the SHA goes into a
      # file in the build context instead: the Dockerfile copies `.app-commit` into the
      # image and lib/host-runtime.js reads it. (.app-commit is gitignored.)
      - name: Stamp the commit into the image
        run: echo "${GITHUB_SHA::7}" > .app-commit

      - name: Deploy to Cloudflare
        run: npx wrangler deploy

      # Confirms the NEW code is the code answering: /health carries the 7-character
      # commit. The old instance keeps answering (with the old commit) until the new one
      # is up and has taken over, which on production's machine takes several minutes.
      # 100 tries, 15 seconds apart (25 minutes): the Worker gives up on a new instance
      # after 20. A request may wait up to a minute while the hand-over happens, hence
      # the long --max-time.
      # A red run here means the new code is NOT serving: the hand-over never began, or the
      # new app did not start and the old instance was started again. GET /internal/rollout
      # (x-tick-token) says which.
      - name: Wait for the new commit on /health
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 100); do
            body="$(curl -fsS --max-time 60 https://app.pbjsatime.com/health 2>/dev/null || true)"
            if echo "$body" | grep -q "\"commit\":\"$want\""; then
              echo "app.pbjsatime.com/health reports $want (try $i)"
              exit 0
            fi
            echo "try $i/100: /health does not report $want yet"
            sleep 15
          done
          echo "::error::app.pbjsatime.com/health never reported $want. The previous version is still serving. GET /internal/rollout (x-tick-token) says why the hand-over did not happen."
          exit 1
