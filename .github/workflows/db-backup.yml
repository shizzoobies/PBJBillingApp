name: db-backup

# Nightly Postgres backup to Cloudflare R2, with a restore drill
# ("a backup that has never been restored is a hope, not a backup" -
# docs/plans/resilience-2026-09.md section 2.3).
#
# WHY THIS FAILED EVERY NIGHT SINCE IT WAS ADDED (all 48 scheduled runs on
# record, 2026-09-04 onward, are red; found 2026-10-22 by reading
# `gh run view --log-failed`): the four R2_* repository secrets were
# never created, so scripts/db-backup.sh died on `R2_ACCOUNT_ID is required`
# 14 seconds in, with a one-line message buried in the log. DATABASE_PUBLIC_URL
# existed but pointed at Railway's public proxy, which was removed on
# 2026-10-21. This file now (1) checks every secret FIRST and fails with one
# red annotation per missing secret plus a run summary, and (2) reads the
# database from BACKUP_DATABASE_URL (the Neon URL once the move is done).
# Until BACKUP_DATABASE_URL and the R2_* secrets exist, the job is MEANT to be
# red: a red night with a clear reason beats a silent gap.
#
# Repo secrets (Settings > Secrets and variables > Actions - names only here,
# values never touch this file):
#   BACKUP_DATABASE_URL   Connection string of the database to back up (Neon:
#                         the DIRECT, non-pooled URL). Ending it with
#                         ?sslmode=verify-full&sslrootcert=system makes the
#                         runner check the server certificate.
#   R2_ACCOUNT_ID         Cloudflare account id (builds the R2 S3 endpoint).
#   R2_ACCESS_KEY_ID      R2 API token access key id (Object Read & Write on
#                         the one bucket).
#   R2_SECRET_ACCESS_KEY  R2 API token secret.
#   R2_BUCKET             R2 bucket the dumps live in (bucket lock: 30 days,
#                         set in the Cloudflare dashboard - see the runbook).
#
# See docs/runbooks/db-backup-and-restore.md for setup, the restore procedure
# and how to tell this is actually working.

on:
  schedule:
    # 08:15 UTC = 03:15/04:15 US-Eastern depending on DST - quiet hours for a
    # US-East firm, and off the hour so it isn't queued behind everyone
    # else's on-the-hour crons.
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      run_restore_drill:
        description: 'Also run the restore drill (it always runs automatically on the 1st of the month)'
        type: boolean
        default: false

permissions:
  contents: read

# A backup mid-dump should never be cancelled by a newer trigger - unlike
# verify.yml's CI runs, there's no "in-flight, now-stale" work here to save
# time by killing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Postgres major version of the database being backed up. Railway was 18.6
  # (verified 2026-09-03) and Neon is created as 18, so this stays 18. pg_dump
  # refuses a server newer than itself, and the restore drill's throwaway
  # container reads it too. If the provider ever upgrades, this one line is the
  # fix.
  PG_MAJOR: '18'

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dump_name: ${{ steps.dump.outputs.dump_name }}
      run_drill: ${{ steps.decide-drill.outputs.run_drill }}
      # The env context is not available inside a services: block, so the
      # drill job reads the major version through this output instead.
      pg_major: ${{ env.PG_MAJOR }}
    steps:
      - uses: actions/checkout@v4

      # First, before anything is installed: say exactly which secret is
      # missing. This is what turns "failed in 14 s for no visible reason"
      # into a one-glance diagnosis.
      - name: Check that every required secret is set
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          for name in BACKUP_DATABASE_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Backup secret missing::Repository secret ${name} is not set (or is empty), so no database backup was taken. Add it under Settings > Secrets and variables > Actions. See docs/runbooks/db-backup-and-restore.md."
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            {
              echo "## Database backup NOT taken"
              echo
              echo "Missing repository secret(s):${missing}"
              echo
              echo "Nothing was dumped and nothing was uploaded. Set the secret(s) above, then re-run this workflow from the Actions tab. Setup steps: docs/runbooks/db-backup-and-restore.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All five backup secrets are set."

      - name: Install postgresql-client ${{ env.PG_MAJOR }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${PG_MAJOR}"
          # Pinned explicitly onto PATH rather than trusting
          # update-alternatives, in case the runner image ever ships a
          # different default client version.
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Verify pg_dump matches PG_MAJOR
        run: pg_dump --version

      - name: Dump, upload to R2 and confirm the object is there
        id: dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/db-backup.sh

      - name: Decide whether to run the restore drill
        id: decide-drill
        run: |
          MANUAL="${{ github.event_name == 'workflow_dispatch' && inputs.run_restore_drill }}"
          TODAY="$(date -u +%d)"
          if [ "$MANUAL" = "true" ] || [ "$TODAY" = "01" ]; then
            echo "run_drill=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_drill=false" >> "$GITHUB_OUTPUT"
          fi

  restore-drill:
    needs: backup
    if: needs.backup.outputs.run_drill == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ needs.backup.outputs.pg_major }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client ${{ env.PG_MAJOR }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      # The dump is NEVER handed over as a GitHub Actions artifact: this repository
      # is public, and an artifact is downloadable by anyone who can read the repo.
      # The drill instead pulls the object the backup job just uploaded to R2 (which
      # also proves the uploaded copy, not a local one, is restorable).
      - name: Download tonight's dump from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DUMP_NAME: ${{ needs.backup.outputs.dump_name }}
          AWS_DEFAULT_REGION: auto
        run: |
          echo "::add-mask::${R2_ACCESS_KEY_ID}"
          echo "::add-mask::${R2_SECRET_ACCESS_KEY}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          mkdir -p dump
          aws s3 cp "s3://${R2_BUCKET}/daily/${DUMP_NAME}" "dump/${DUMP_NAME}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
          ls -l dump

      - name: Restore into the throwaway Postgres and verify row counts
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: restore_drill
          DUMP_PATH: dump/${{ needs.backup.outputs.dump_name }}
        run: bash scripts/db-restore-drill.sh
